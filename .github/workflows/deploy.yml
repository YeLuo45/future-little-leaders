name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure npm mirror
        run: |
          cd ${{ github.workspace }}/src
          npm config set registry https://registry.npmmirror.com

      - name: Install dependencies
        run: |
          cd ${{ github.workspace }}/src
          npm install --legacy-peer-deps

      - name: Build H5
        run: |
          cd ${{ github.workspace }}/src
          npm run build:h5

      - name: Deploy to gh-pages
        run: |
          cd ${{ github.workspace }}/src/dist/build/h5
          touch .nojekyll
          git config --local user.email "hermes@agent.local"
          git config --local user.name "Hermes Agent"
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/YeLuo45/future-little-leaders.git
          git fetch origin gh-pages:refs/heads/gh-pages || true
          git checkout -b gh-pages FETCH_HEAD 2>/dev/null || git checkout --orphan gh-pages
          rm -rf assets index.html static 2>/dev/null || true
          git add .
          git commit -m "Deploy $(date +%Y%m%d%H%M%S)"
          git push origin gh-pages --force
